<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Blog — AllSquared</title>
<meta name="description" content="Insights on contracts, escrow, and payment from AllSquared."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script>
  // Apply theme before paint to avoid FOUC
  if (location.hostname.endsWith('.uk') || location.hostname === 'allsquared.uk') {
    document.documentElement.setAttribute('data-theme', 'bold');
  }
</script>
<style>
/* ── NAVY THEME (default / .io) ─────── */
:root {
  --bg: #FAFAF7; --bg2: #F2F1EB; --bg-line: #E2E0D6;
  --ink: #0B1B33; --ink2: #2D466F; --ink3: #6B7E9E;
  --accent: #1F6B3F; --accent-bg: #E5F1EA;
  --hi: #0B1B33;
  --border: 1px solid #C7D0E0;
  --border-hi: 1px solid #0B1B33;
  --shadow: none;
  --r: 10px;
  --heading: 'Inter Tight',-apple-system,sans-serif;
  --body: 'Inter Tight',-apple-system,sans-serif;
  --serif: 'Source Serif 4',Georgia,serif;
  --mono: 'JetBrains Mono',ui-monospace,monospace;
  --card-hover-bg: #F2F1EB;
  --label-bg: #0B1B33; --label-color: #fff;
  --arrow-color: #9BA8C2;
}

/* ── BOLD THEME (.uk) ───────────────── */
[data-theme="bold"] {
  --bg: #FFF8EC; --bg2: #FFE9B0; --bg-line: #000;
  --ink: #000000; --ink2: #000000; --ink3: rgba(0,0,0,.55);
  --accent: #C9F546; --accent-bg: #FFE9B0;
  --hi: #C9F546;
  --border: 3px solid #000;
  --border-hi: 3px solid #000;
  --shadow: 6px 6px 0 #000;
  --shadow-sm: 4px 4px 0 #000;
  --r: 0px;
  --heading: 'Archivo Black',Impact,sans-serif;
  --body: 'Space Grotesk',-apple-system,sans-serif;
  --serif: 'Space Grotesk',-apple-system,sans-serif;
  --mono: 'JetBrains Mono',ui-monospace,monospace;
  --card-hover-bg: #C9F546;
  --label-bg: #000; --label-color: #C9F546;
  --arrow-color: rgba(0,0,0,.3);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.55; font-weight:500;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
[data-theme="bold"] body{
  background-image:radial-gradient(circle at 1px 1px,rgba(0,0,0,.12) 1px,transparent 0);
  background-size:24px 24px;
}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:var(--ink)}

/* ── NAV ─── */
nav.top{
  position:sticky;top:0;z-index:50;
  border-bottom:var(--border);
}
body:not([data-theme="bold"]) nav.top{
  background:rgba(250,250,247,.92);
  backdrop-filter:blur(14px) saturate(160%);
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  border-bottom:1px solid #E2E0D6;
}
[data-theme="bold"] nav.top{background:var(--bg);border-bottom:var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:24px}

/* nav logo */
.as-mark{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
body:not([data-theme="bold"]) .as-mark{font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:-.01em}
[data-theme="bold"] .as-mark{font-family:var(--heading);font-size:18px;letter-spacing:-.01em;text-transform:uppercase}
.as-mark .glyph{
  width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;
  border:var(--border);border-radius:var(--r);font-family:var(--mono);font-size:12px;font-weight:700;
}
[data-theme="bold"] .as-mark .glyph{background:var(--accent)}

.nav-links{display:flex;align-items:center;gap:20px;font-size:14px;font-weight:600}
.nav-links a{
  color:var(--ink2);transition:color .15s;
}
.nav-links a:hover{color:var(--ink)}
.nav-links a.active{color:var(--ink)}
[data-theme="bold"] .nav-links a{
  border:var(--border);padding:7px 14px;background:var(--bg);
  color:var(--ink);transition:box-shadow .15s,transform .15s;
}
[data-theme="bold"] .nav-links a:hover{box-shadow:var(--shadow-sm);transform:translate(-2px,-2px)}
[data-theme="bold"] .nav-links a.active{background:var(--accent)}

/* ── HERO ─── */
.hero{padding:56px 0 40px;border-bottom:var(--border)}
.hero-label{
  display:inline-block;margin-bottom:14px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
}
body:not([data-theme="bold"]) .hero-label{
  background:var(--bg2);color:var(--ink2);border:var(--border);
  padding:4px 12px;border-radius:100px;
}
[data-theme="bold"] .hero-label{
  background:var(--ink);color:var(--accent);padding:4px 10px;
}
.hero h1{
  font-family:var(--heading);font-size:clamp(36px,6vw,68px);
  line-height:.95;letter-spacing:-.02em;margin-bottom:14px;
}
body:not([data-theme="bold"]) .hero h1{font-weight:800;letter-spacing:-.03em}
[data-theme="bold"] .hero h1{text-transform:uppercase}
.hero p{font-size:18px;font-weight:400;max-width:480px;color:var(--ink2);line-height:1.5}

/* ── POST LIST ─── */
.posts-grid{padding:40px 0 80px}
.post-card{
  border-bottom:var(--border);padding:28px 0;
  display:grid;grid-template-columns:1fr auto;align-items:start;gap:24px;
  transition:background .15s,padding .15s;cursor:pointer;
}
.post-card:first-child{border-top:var(--border)}

body:not([data-theme="bold"]) .post-card:hover{background:var(--card-hover-bg);padding-left:16px;padding-right:16px;margin:0 -16px;border-radius:var(--r)}
[data-theme="bold"] .post-card:hover{background:var(--accent);padding-left:16px;padding-right:16px;margin:0 -16px}

.post-date{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.post-title{
  font-family:var(--heading);font-size:clamp(20px,2.5vw,28px);
  margin-bottom:8px;line-height:1.05;
}
body:not([data-theme="bold"]) .post-title{font-weight:700;letter-spacing:-.02em}
[data-theme="bold"] .post-title{text-transform:uppercase;letter-spacing:-.01em}
.post-excerpt{font-size:15px;font-weight:400;color:var(--ink2);max-width:560px;line-height:1.5}
.post-arrow{font-size:22px;color:var(--arrow-color);transition:transform .15s,color .15s;margin-top:6px}
.post-card:hover .post-arrow{transform:translateX(4px);color:var(--ink)}

.card-link{display:contents}

/* ── EMPTY / LOADING ─── */
.empty,.loading{padding:80px 0;text-align:center;color:var(--ink3)}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-text{font-family:var(--heading);font-size:24px;letter-spacing:-.01em}
[data-theme="bold"] .empty-text{text-transform:uppercase}
.spinner{width:36px;height:36px;border:3px solid var(--ink);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FOOTER ─── */
footer{border-top:var(--border);padding:24px 0;font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:center}

@media(max-width:600px){
  .wrap{padding:0 16px}
  .hero{padding:36px 0 28px}
  .nav-links{display:none}
}
</style>
</head>
<body>
<nav class="top">
  <div class="wrap">
    <div class="nav-inner">
      <a class="as-mark" href="/">
        <div class="glyph">A²</div>
        <span id="nav-logo-text">AllSquared</span>
      </a>
      <div class="nav-links">
        <a href="/blog/" class="active">Blog</a>
        <a href="/#waitlist" id="cta-link">Get early access</a>
      </div>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="hero-label">Insights</div>
    <h1>The Blog</h1>
    <p>Contracts, escrow, and getting paid. No fluff.</p>
  </div>
  <div id="posts" class="posts-grid">
    <div class="loading"><div class="spinner"></div><p>Loading…</p></div>
  </div>
</div>

<footer><div class="wrap">© AllSquared Ltd · <a href="/">allsquared.io</a></div></footer>

<script>
const isBold = document.documentElement.getAttribute('data-theme') === 'bold';

// Update footer domain
document.querySelector('footer a').href = '/';
document.querySelector('footer a').textContent = location.hostname || 'allsquared.io';

// Bold nav logo
if (isBold) document.getElementById('nav-logo-text').textContent = 'ALLSQUARED';

function formatDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}

async function loadPosts() {
  const container = document.getElementById('posts');
  try {
    const res = await fetch('/api/posts');
    if (!res.ok) throw new Error();
    const posts = await res.json();
    if (!posts.length) {
      container.innerHTML = `<div class="empty"><div class="empty-icon">✦</div><div class="empty-text">No posts yet.</div></div>`;
      return;
    }
    container.innerHTML = posts.map(p => `
      <div class="post-card" onclick="location.href='/blog/${p.slug}'">
        <a class="card-link" href="/blog/${p.slug}">
          <div>
            <div class="post-date">${formatDate(p.published_at)}</div>
            <div class="post-title">${p.title}</div>
            ${p.excerpt ? `<div class="post-excerpt">${p.excerpt}</div>` : ''}
          </div>
          <div class="post-arrow">→</div>
        </a>
      </div>
    `).join('');
  } catch {
    container.innerHTML = `<div class="empty"><div class="empty-icon">!</div><div class="empty-text">Couldn't load posts.</div></div>`;
  }
}

loadPosts();
</script>
</body>
</html>
